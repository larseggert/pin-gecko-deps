[project]
name = "pin-gecko-deps"
version = "0.1.0"
description = "Keep a Rust workspace's Cargo.lock aligned with Firefox/Gecko's lockfile"
readme = "README.md"
license = "Apache-2.0 OR MIT"
requires-python = ">=3.11"
dependencies = [
    "packaging",
    "tomlkit",
]

[project.urls]
Repository = "https://github.com/larseggert/pin-gecko-deps"

[project.scripts]
compare-lockfile = "pin_gecko_deps.compare_lockfile:main"
update-lockfile = "pin_gecko_deps.update_lockfile:main"

[dependency-groups]
dev = ["ruff", "ty", "pytest"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
